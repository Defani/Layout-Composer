<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simulasi KLHK</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
<script>document.write('<link rel="stylesheet" href="../plugin/style.css?v=' + Date.now() + '" />')</script>
<style>
  :root { --background: 0 0% 100%; --foreground: 222 47% 11%; --card: 210 20% 98%; --border: 214 32% 88%; --muted: 210 40% 96%; --muted-foreground: 215 16% 47%; --accent: 210 40% 94%; --primary: 221 83% 53%; --primary-foreground: 0 0% 100%; }
  html.dark { --background: 222 47% 8%; --foreground: 210 40% 96%; --card: 222 40% 11%; --border: 217 25% 22%; --muted: 217 30% 15%; --muted-foreground: 215 20% 65%; --accent: 217 30% 18%; --primary: 217 91% 60%; --primary-foreground: 0 0% 100%; }
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 40px 0 0 0; }
  #bar { height: 40px; display: flex; gap: 8px; align-items: center; padding: 0 12px; border-bottom: 1px solid #ddd; }
</style>
</head>
<body>
<div id="bar"><b>GeoLibre (simulasi) — Kawasan Hutan Aceh</b><button id="open">Buka Layout Composer</button></div>
<div id="map"></div>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script type="module">
  // KLHK forest-function classes (fungsitap codes) and SK MENLHK 399/2024 colors
  const FUNGSI = [
    { code: /^1002/, name: "Kawasan Suaka Alam / Pelestarian Alam (KSA/KPA)", color: "#ad3fff" },
    { code: /^1001/, name: "Hutan Lindung (HL)", color: "#02ad00" },
    { code: /^1004/, name: "Hutan Produksi Terbatas (HPT)", color: "#8af200" },
    { code: /^1003/, name: "Hutan Produksi Tetap (HP)", color: "#ffff00" },
    { code: /^1005/, name: "Hutan Produksi yang dapat Dikonversi (HPK)", color: "#ff5eff" },
  ];
  const data = await fetch("data/kawasan_hutan.geojson").then((r) => r.json());
  for (const f of data.features) f.properties.fungsi = (FUNGSI.find((x) => x.code.test(String(f.properties.fungsitap))) || {}).name || "Lainnya";
  const map = new maplibregl.Map({ container: "map", style: "https://tiles.openfreemap.org/styles/positron", center: [96.6, 4.35], zoom: 7.2, preserveDrawingBuffer: true });
  const layers = [{ id: "kawasan-hutan", name: "Kawasan Hutan Provinsi Aceh", type: "geojson", visible: true }];
  map.once("style.load", () => {
    map.addSource("kawasan-hutan", { type: "geojson", data });
    const match = ["match", ["get", "fungsi"]];
    for (const f of FUNGSI) match.push(f.name, f.color);
    match.push("#ffffff");
    map.addLayer({ id: "kawasan-hutan-fill", type: "fill", source: "kawasan-hutan", paint: { "fill-color": match, "fill-opacity": 0.9 } });
    map.addLayer({ id: "kawasan-hutan-line", type: "line", source: "kawasan-hutan", paint: { "line-color": "#000000", "line-width": 0.6 } });
  });
  const app = {
    getMap: () => map,
    listLayers: () => layers,
    getLayerFeatures: (id) => (id === "kawasan-hutan" ? data.features : []),
    addMapControl: (c, pos) => map.addControl(c, pos),
    removeMapControl: (c) => map.removeControl(c),
    registerToolbarMenu: () => () => {},
    getProjectSnapshot: () => ({ name: "Peta Kawasan Hutan Provinsi Aceh", layers }),
  };
  const mod = await import("../plugin/index.js?v=" + Date.now());
  mod.plugin.activate(app);
  window.__app = app;
  document.getElementById("open").onclick = () => window.LayoutComposer.open();
</script>
<script type="module" src="shots.js"></script>
</body>
</html>
