<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Layout Composer — test page</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" />
<script>document.write('<link rel="stylesheet" href="../plugin/style.css?v=' + Date.now() + '" />')</script>
<style>
  /* GeoLibre-like shadcn tokens so the composer themes as it would in the app */
  :root { --background: 0 0% 100%; --foreground: 222 47% 11%; --card: 210 20% 98%; --border: 214 32% 88%; --muted: 210 40% 96%; --muted-foreground: 215 16% 47%; --accent: 210 40% 94%; --primary: 221 83% 53%; --primary-foreground: 0 0% 100%; }
  html.dark { --background: 222 47% 8%; --foreground: 210 40% 96%; --card: 222 40% 11%; --border: 217 25% 22%; --muted: 217 30% 15%; --muted-foreground: 215 20% 65%; --accent: 217 30% 18%; --primary: 217 91% 60%; --primary-foreground: 0 0% 100%; }
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 40px 0 0 0; }
  #bar { height: 40px; display: flex; gap: 8px; align-items: center; padding: 0 12px; border-bottom: 1px solid #ddd; }
</style>
</head>
<body>
<div id="bar"><b>GeoLibre (mock) — Kabupaten Kuningan</b><button id="open">Open Layout Composer</button><button id="dark">Dark / light</button></div>
<div id="map"></div>
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script type="module">
  // Real data in test/data (not in git): Kuningan slope classes, sub-district
  // boundaries (Peta Dasar Nasional) and a label point per sub-district.
  const get = (f) => fetch(`data/${f}`).then((r) => r.json());
  const [lereng, kecamatan, titik] = await Promise.all([get("kelerengan_kuningan.geojson"), get("kecamatan_kuningan.geojson"), get("ibukota_kecamatan.geojson")]);
  const KELAS = { "0-8 %": "#2E8B22", "8-15 %": "#55D400", "15-25%": "#F2EA1D", "25-40%": "#FF9A00", ">40%": "#E60000" };
  const map = new maplibregl.Map({ container: "map", style: "https://tiles.openfreemap.org/styles/liberty", center: [108.59, -6.99], zoom: 9.7, preserveDrawingBuffer: true });
  const layers = [
    { id: "kelerengan", name: "Kelerengan Kabupaten Kuningan", type: "geojson", visible: true },
    { id: "kecamatan", name: "Batas Kecamatan", type: "geojson", visible: true },
    { id: "titik-kec", name: "Titik Kecamatan", type: "geojson", visible: true },
    { id: "osm-hot", name: "OpenStreetMap HOT", type: "xyz", visible: true },
  ];
  // snapshot-only layers, as GeoLibre reports them (rasters are drawn by deck.gl, not in listLayers)
  const snapLayers = [
    { id: "dem", name: "Elevasi Mapzen Terrain (m)", type: "cog", visible: true, source: { url: "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png" }, metadata: { rasterState: { bands: [1], colormap: "terrain", rescale: "25, 3078" } } },
    { id: "ndvk0", name: "NDVK0", type: "raster", visible: true, metadata: { rasterState: { bands: [1], colormap: "viridis", stats: [{ min: -0.997, max: 0.037 }] } } },
    { id: "osm-hot", name: "OpenStreetMap HOT", type: "xyz", source: { type: "raster", tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"], tileSize: 256 }, metadata: { sourceKind: "xyz-url" } },
  ];
  map.once("style.load", () => {
    map.addSource("osm-hot", { type: "raster", tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"], tileSize: 256 });
    map.addLayer({ id: "osm-hot", type: "raster", source: "osm-hot", paint: { "raster-opacity": 0.5 } });
    map.addSource("terrain", { type: "raster-dem", tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"], encoding: "terrarium", tileSize: 256, maxzoom: 14 });
    map.addLayer({ id: "hillshade", type: "hillshade", source: "terrain", paint: { "hillshade-exaggeration": 0.35 } });
    map.addSource("kelerengan", { type: "geojson", data: lereng });
    map.addLayer({ id: "kelerengan-fill", type: "fill", source: "kelerengan", paint: { "fill-color": ["match", ["get", "Kelas_lere"], ...Object.entries(KELAS).flat(), "#cccccc"], "fill-opacity": 0.85 } });
    map.addSource("kecamatan", { type: "geojson", data: kecamatan });
    map.addLayer({ id: "kecamatan-line", type: "line", source: "kecamatan", paint: { "line-color": "#1f2937", "line-width": 0.9, "line-dasharray": [4, 1.5, 1, 1.5] } });
    map.addSource("titik-kec", { type: "geojson", data: titik });
    map.addLayer({ id: "titik-kec-circle", type: "circle", source: "titik-kec", paint: { "circle-color": "#ffffff", "circle-radius": 3, "circle-stroke-color": "#111827", "circle-stroke-width": 1.2 } });
  });
  const app = {
    getMap: () => map,
    listLayers: () => layers,
    addMapControl: (c, pos) => map.addControl(c, pos),
    removeMapControl: (c) => map.removeControl(c),
    registerToolbarMenu: (m) => { console.log("menu registered", m.label); return () => {}; },
    getLayerFeatures: (id) => ({ kelerengan: lereng, kecamatan, "titik-kec": titik }[id]?.features || []),
    getProjectSnapshot: () => ({ name: "Peta Kelerengan Kabupaten Kuningan", layers: snapLayers }),
  };
  const mod = await import("../plugin/index.js?v=" + Date.now());
  mod.plugin.activate(app);
  window.__app = app;
  document.getElementById("open").onclick = () => window.LayoutComposer.open();
  document.getElementById("dark").onclick = () => document.documentElement.classList.toggle("dark");
</script>
<script type="module" src="shots.js"></script>
</body>
</html>
